[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vn-legal-rag-assistant"
version = "0.1.0"
description = "Trợ lý tra cứu Luật Trật tự, an toàn giao thông đường bộ bằng RAG"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "streamlit>=1.40,<2.0",
    "pydantic-settings>=2.6,<3.0",
    "python-docx>=1.1,<2.0",
    "qdrant-client>=1.12,<2.0",
    "rank-bm25>=0.2,<1.0",
    "sentence-transformers>=3.3,<6.0",
    "openai>=1.50,<3.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
